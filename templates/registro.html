<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>ComfeSocial - Registro</title>
    <link rel="stylesheet" type="text/css" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <header>
        <div class="logo">ComfeSocial</div>
        <div class="nav-links">
            <a href="/login">Iniciar sesión</a>
            <a href="/registro">Registrarse</a>
        </div>
    </header>

    <div class="container">
        <h1>Crear cuenta en ComfeSocial</h1>
        <form method="POST" action="/registro">
            <label for="telefono">Teléfono:</label>
            <input type="tel" id="telefono" name="telefono" placeholder="Teléfono" required><br><br>

            <label for="usuario">Usuario (@nombre):</label>
            <input type="text" id="usuario" name="usuario" placeholder="@usuario" required><br><br>

            <label for="password">Contraseña:</label>
            <input type="password" id="password" name="password" placeholder="Contraseña" required><br><br>

            <button type="submit">Registrar</button>
        </form>

        <p>¿Ya tienes cuenta? <a href="/login">Inicia sesión aquí</a></p>

        <!-- Mensajes flash -->
        {% with messages = get_flashed_messages() %}
          {% if messages %}
            <ul class="messages">
              {% for msg in messages %}
                <li>{{ msg }}</li>
              {% endfor %}
            </ul>
          {% endif %}
        {% endwith %}
    </div>
</body>
</html>

</html>
