<!DOCTYPE html>
<html>
<head>
    <title>Chat con {{ receptor.usuario }}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<div class="container mt-4">
    <h3>Chat entre {{ emisor.usuario }} y {{ receptor.usuario }}</h3>
    <div class="border p-3 mb-3" style="height:300px; overflow-y:scroll;">
        {% for m in mensajes %}
            <p><strong>{{ m.emisor.usuario }}:</strong> {{ m.contenido }}</p>
        {% endfor %}
    </div>
    <form method="POST">
        <div class="input-group">
            <input type="text" name="mensaje" class="form-control" placeholder="Escribe tu mensaje...">
            <button class="btn btn-primary">Enviar</button>
        </div>
    </form>
</div>
</body>
</html>
