<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ComfeSocial</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style_new.css') }}">
    <!-- Favicon -->
    <link rel="icon" href="{{ url_for('static', filename='logocomfesocial.png') }}">
</head>
<body>
    <header>
        <div class="logo">
            <span class="logo-mark" aria-hidden="true">C</span>
            <span>ComfeSocial</span>
        </div>
        <nav class="nav-links">
            <a href="{{ url_for('login') }}">Iniciar sesión</a>
            <a href="{{ url_for('registro') }}">Registrarse</a>
        </nav>
    </header>

    <main class="container">
        <section class="intro">
            <h1>Bienvenido a <span class="highlight">ComfeSocial</span></h1>
            <p>Tu red social para compartir, conectar y crecer junto a tu comunidad.</p>
        </section>

        <section class="actions">
            <a href="{{ url_for('login') }}" class="btn btn-primary">Iniciar Sesión</a>
            <a href="{{ url_for('registro') }}" class="btn btn-secondary">Registrarse</a>
        </section>
    </main>

    <footer>
        <p>&copy; 2026 ComfeSocial. Todos los derechos reservados.</p>
    </footer>
</body>
</html>
