<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ComfeSocial</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style_new.css') }}">
    <link rel="manifest" href="{{ url_for('static', filename='manifest.json') }}">
    <meta name="theme-color" content="#1877f2">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="ComfeSocial">
    <link rel="apple-touch-icon" href="{{ url_for('static', filename='icon-192.svg') }}">
    <!-- Favicon -->
    <link rel="icon" href="{{ url_for('static', filename='logocomfesocial.png') }}">
</head>
<body>
    <header>
        <div class="logo">
            <span class="logo-mark" aria-hidden="true"><span class="globe-lines"></span></span>
            <span>ComfeSocial</span>
        </div>
        <nav class="nav-links">
            <a href="{{ url_for('login') }}">Iniciar sesión</a>
            <a href="{{ url_for('registro') }}">Registrarse</a>
        </nav>
    </header>

    <main class="container">
        <section class="intro">
            <h1>Bienvenido a <span class="highlight">ComfeSocial</span></h1>
            <p>Tu red social para compartir, conectar y crecer junto a tu comunidad.</p>
        </section>

        <section class="actions">
            <a href="{{ url_for('login') }}" class="btn btn-primary">Iniciar Sesión</a>
            <a href="{{ url_for('registro') }}" class="btn btn-secondary">Registrarse</a>
        </section>
    </main>

    <footer>
        <p>&copy; 2026 ComfeSocial. Todos los derechos reservados.</p>
    </footer>
    <script>if ('serviceWorker' in navigator) navigator.serviceWorker.register('{{ url_for('static', filename='sw.js') }}');</script>
</body>
</html>
