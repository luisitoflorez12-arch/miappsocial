<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ grupo.nombre }} - ComfeSocial</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style_new.css') }}">
</head>
<body>
    <div class="chat-page">
        <div class="container chat-page-container">
            <div class="chat-container">
                <div class="chat-header">
                    <a href="{{ url_for('mensajes', user_id=user_id) }}" class="back-link" aria-label="Volver a mis chats">←</a>
                    <div class="chat-header-person"><h4 class="chat-header-name">{{ grupo.nombre }}</h4><small>{{ grupo.miembros|length }} integrantes</small></div>
                    <span class="group-header-mark">#</span>
                </div>
                <div class="chat-messages" id="mensajesArea">
                    {% for mensaje in mensajes %}
                        <div class="message {% if mensaje.emisor_id == user_id %}sent{% else %}received{% endif %}">
                            <div><small class="text-muted group-sender">{{ mensaje.emisor.usuario }}</small><div class="bubble"><span class="message-text">{{ mensaje.contenido }}</span></div></div>
                        </div>
                    {% else %}
                        <div class="group-empty-chat"><span>#</span><p>Este grupo está listo para su primer mensaje.</p></div>
                    {% endfor %}
                </div>
                <div class="chat-input-area">
                    <form method="POST" class="chat-form">
                        <div class="input-group"><input type="text" name="mensaje" class="form-control" placeholder="Escribe al grupo..." autocomplete="off" required><button class="btn btn-primary" type="submit">Enviar <span aria-hidden="true">→</span></button></div>
                    </form>
                </div>
            </div>
        </div>
    </div>
    <script>setTimeout(function () { const area = document.getElementById('mensajesArea'); area.scrollTop = area.scrollHeight; }, 100);</script>
</body>
</html>
